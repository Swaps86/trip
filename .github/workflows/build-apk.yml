name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Prepare signing key
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/tripsplit.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/tripsplit.jks" >> "$GITHUB_ENV"
            echo "Signing with fixed key"
          else
            echo "No signing key secret found - using debug key (updates may need uninstall)"
          fi
      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          KEY_ALIAS: tripsplit
        run: gradle assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TripSplit-APK
          path: app/build/outputs/apk/release/app-release.apk
